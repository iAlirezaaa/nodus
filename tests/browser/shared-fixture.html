<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>Shared UI test fixture · Nodus</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;font:12px/1.5 system-ui,sans-serif;background:#0e1319;color:#dce8e1}header{height:76px;padding:10px 16px;border-bottom:1px solid #344437;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header strong{display:block;color:#b8d9a4}header p{margin:0;font-size:10px;color:#8faaa0}.controls{display:flex;align-items:center;gap:13px;flex-wrap:wrap}button{font:inherit;background:#22392b;color:#dbedd8;border:1px solid #587357;padding:5px 9px;border-radius:6px;cursor:pointer}label{display:flex;gap:5px;align-items:center;font-size:11px}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 76px);gap:3px}.session{min-width:0;display:grid;grid-template-rows:27px 1fr}.session h2{margin:0;padding:4px 12px;font-size:10px;letter-spacing:.03em;background:#18252e;color:#adc7ed}.session:last-child h2{background:#1a2c24;color:#abd3ba}iframe{border:0;width:100%;height:100%;min-height:0;background:#10131a}.status{font-family:ui-monospace,monospace;font-size:10px;color:#a8c79a}@media(max-width:900px){header{height:106px;gap:8px}main{height:calc(100% - 106px)}.controls{gap:7px}}
  body.mobile-frames{height:auto;min-height:100%;overflow:auto}body.mobile-frames main{grid-template-columns:390px 390px;justify-content:center;gap:20px;height:auto;min-width:840px;padding:16px 20px 24px}body.mobile-frames .session{width:390px;height:871px;grid-template-rows:27px 844px}body.mobile-frames iframe{width:390px;height:844px}
</style></head><body>
<header><div><strong>Shared UI test fixture</strong><p>Synthetic accounts and server · production authentication unchanged</p><output id="fixture-status" class="status">Starting…</output></div><div class="controls"><label><input id="owner-offline" type="checkbox"/>A offline</label><label><input id="editor-offline" type="checkbox"/>B offline</label><label><input id="mobile-frames" type="checkbox"/>390 px frames</label><button id="drop-ack" type="button">Drop next A save response</button><button id="fixture-reset" type="button">Reset fixture</button></div></header>
<main><section class="session"><h2>A · owner@fixture.test · room owner</h2><iframe id="session-owner" title="Nodus synthetic owner session"></iframe></section><section class="session"><h2>B · editor@fixture.test · editor</h2><iframe id="session-editor" title="Nodus synthetic editor session"></iframe></section></main>
<script type="module" src="./shared-fixture.ts"></script></body></html>
