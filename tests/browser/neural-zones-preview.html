<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Nodus responsive fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #dce2e6; color: #25333b; font: 14px/1.4 system-ui,sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 18px; background: #f8fafb; border-bottom: 1px solid #bdc8cc; }
      header p { margin: 0; }
      #viewport-controls { display: flex; gap: 6px; }
      button { min-height: 36px; padding: 6px 12px; border: 1px solid #8b9aa4; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #293f4b; border-color: #293f4b; color: white; }
      main { padding: 18px 12px; overflow-x: auto; }
      iframe { box-sizing: content-box; display: block; width: calc(100% - 2px); max-width: none; height: 844px; margin: 0 auto; border: 1px solid #8b9aa4; background: #0c1413; box-shadow: 0 5px 24px #21333b22; }
      output { margin-inline-start: auto; color: #50636d; }
    </style>
  </head>
  <body>
    <header>
      <p><strong>Nodus · SYNTHETIC UI FIXTURE</strong><br />Real application in an isolated, adjustable viewport.</p>
      <div id="viewport-controls" aria-label="Fixture viewport width">
        <button type="button" data-width="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-width="390" aria-pressed="false">390 px</button>
        <button type="button" data-width="320" aria-pressed="false">320 px</button>
      </div>
      <output id="viewport-status" role="status">Desktop · 844 px height</output>
    </header>
    <main><iframe id="fixture-frame" src="./neural-zones-fixture.html" title="Nodus synthetic neural zones application" allow="clipboard-read; clipboard-write"></iframe></main>
    <script type="module">
      if (!import.meta.env.DEV) throw new Error('This viewport harness is development-only.');
      const frame = document.getElementById('fixture-frame');
      const buttons = [...document.querySelectorAll('[data-width]')];
      for (const button of buttons) button.addEventListener('click', () => {
        const width = button.dataset.width;
        frame.style.width = width === 'desktop' ? 'calc(100% - 2px)' : `${width}px`;
        for (const item of buttons) item.setAttribute('aria-pressed', String(item === button));
        document.getElementById('viewport-status').textContent = `${width === 'desktop' ? 'Desktop' : `${width} px`} · 844 px height`;
      });
    </script>
  </body>
</html>
