name: ND-001 full-source release checks

on:
  push:
    branches:
      - fix/nd-001-search-clarity
    paths:
      - '.github/workflows/nd-001-release-gates.yml'
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'tests/**'
      - 'db/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nd001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install complete locked dependencies
        run: npm run install:ci
      - name: Native full suite, TypeScript and production build (fail fast)
        run: npm run verify:release
